name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret [KEYSTORE_BASE64] 未配置！请在 Settings -> Secrets 中添加。"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::GitHub Secrets [KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD] 尚未配置！请在 Settings -> Secrets 中补全这3个密钥参数。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > app-tv/release.jks
          echo "Keystore decoded successfully."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Determine Build Targets
        id: targets
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" == *-tv ]]; then
            echo "tasks=:app-tv:assembleRelease" >> $GITHUB_OUTPUT
            echo "build_tv=true" >> $GITHUB_OUTPUT
            echo "build_mobile=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == *-mobile ]]; then
            echo "tasks=:app-mobile:assembleRelease" >> $GITHUB_OUTPUT
            echo "build_tv=false" >> $GITHUB_OUTPUT
            echo "build_mobile=true" >> $GITHUB_OUTPUT
          else
            echo "tasks=:app-tv:assembleRelease :app-mobile:assembleRelease" >> $GITHUB_OUTPUT
            echo "build_tv=true" >> $GITHUB_OUTPUT
            echo "build_mobile=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: ./gradlew ${{ steps.targets.outputs.tasks }} --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Package and Rename Release Assets
        id: prepare_asset
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v1.0.0"
          fi
          CLEAN_VERSION="${TAG_NAME#v}"
          CLEAN_VERSION="${CLEAN_VERSION%-tv}"
          CLEAN_VERSION="${CLEAN_VERSION%-mobile}"
          VERSION_CODE=$(git rev-list --count HEAD)
          
          mkdir -p release-assets

          # TV 全架构 APK
          if [ "${{ steps.targets.outputs.build_tv }}" = "true" ]; then
            TV_SRC="app-tv/build/outputs/apk/release/app-tv-release.apk"
            TV_DST="release-assets/melodist-tv-${CLEAN_VERSION}-${VERSION_CODE}.apk"
            if [ -f "$TV_SRC" ]; then
              cp "$TV_SRC" "$TV_DST"
              (cd release-assets && sha256sum "melodist-tv-${CLEAN_VERSION}-${VERSION_CODE}.apk" > "melodist-tv-${CLEAN_VERSION}-${VERSION_CODE}.apk.sha256")
            fi
          fi

          # Mobile 全架构 APK (标准版与 OriginOS 增强版)
          if [ "${{ steps.targets.outputs.build_mobile }}" = "true" ]; then
            MOBILE_SRC="app-mobile/build/outputs/apk/standard/release/app-mobile-standard-release.apk"
            MOBILE_DST="release-assets/melodist-mobile-${CLEAN_VERSION}-${VERSION_CODE}.apk"
            if [ -f "$MOBILE_SRC" ]; then
              cp "$MOBILE_SRC" "$MOBILE_DST"
              (cd release-assets && sha256sum "melodist-mobile-${CLEAN_VERSION}-${VERSION_CODE}.apk" > "melodist-mobile-${CLEAN_VERSION}-${VERSION_CODE}.apk.sha256")
            fi

            ORIGINOS_SRC="app-mobile/build/outputs/apk/originOs/release/app-mobile-originOs-release.apk"
            ORIGINOS_DST="release-assets/melodist-mobile-originos-${CLEAN_VERSION}-${VERSION_CODE}.apk"
            if [ -f "$ORIGINOS_SRC" ]; then
              cp "$ORIGINOS_SRC" "$ORIGINOS_DST"
              (cd release-assets && sha256sum "melodist-mobile-originos-${CLEAN_VERSION}-${VERSION_CODE}.apk" > "melodist-mobile-originos-${CLEAN_VERSION}-${VERSION_CODE}.apk.sha256")
            fi
          fi
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ steps.prepare_asset.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
