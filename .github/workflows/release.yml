name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret [KEYSTORE_BASE64] 未配置！请在 Settings -> Secrets 中添加。"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::GitHub Secrets [KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD] 尚未配置！请在 Settings -> Secrets 中补全这3个密钥参数。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > app-tv/release.jks
          echo "Keystore decoded successfully."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        run: ./gradlew :app-tv:assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Package and Rename Release Assets
        id: prepare_asset
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v1.0.0"
          fi
          # 去除开头的 v 字符
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          
          mkdir -p release-assets
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            SRC="app-tv/build/outputs/apk/release/app-tv-${ABI}-release.apk"
            DST="release-assets/melodist-tv-${VERSION_NAME}-${VERSION_CODE}-${ABI}.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$DST"
              (cd release-assets && sha256sum "melodist-tv-${VERSION_NAME}-${VERSION_CODE}-${ABI}.apk" > "melodist-tv-${VERSION_NAME}-${VERSION_CODE}-${ABI}.apk.sha256")
            fi
          done
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ steps.prepare_asset.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
